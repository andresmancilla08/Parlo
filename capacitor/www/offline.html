<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Parlo</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff9f5; --fg: #2a1f3d; --muted: #6f6680; --primary: #ff6b4a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #140e24; --fg: #f5f0ff; --muted: #b3a9c9; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 22px; margin: 0; }
      p { margin: 0; color: var(--muted); max-width: 320px; line-height: 1.45; }
      button { margin-top: 12px; border: 0; border-radius: 999px; background: var(--primary); color: #fff; font: 700 16px system-ui, sans-serif; padding: 14px 28px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Parlo necesita internet para cargar. Revisa tu red y vuelve a intentarlo.</p>
      <button type="button" id="retry">Reintentar</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.href = "https://parlo-lilac.vercel.app/";
      });
    </script>
  </body>
</html>
