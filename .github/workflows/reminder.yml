name: Recordatorio de racha

# Cron HORARIO: el endpoint decide a quién le toca según su hora local, así que
# hay que llamarlo cada hora (el cron de Vercel Hobby sólo corre una vez al día
# y dejaría fuera casi todos los husos horarios).
# GitHub puede retrasar el disparo unos minutos con carga alta: el aviso puede
# llegar tarde, nunca duplicado (`reminder.lastSent` guarda el día local).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # disparo manual para probar

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/reminders
        env:
          BASE_URL: ${{ vars.PARLO_BASE_URL || 'https://parlo-lilac.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Falta el secreto CRON_SECRET del repositorio"; exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/reminders")
          cat response.json; echo
          [ "$code" = "200" ] || { echo "HTTP $code"; exit 1; }
